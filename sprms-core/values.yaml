replicaCount: 1

image:
  repository: dev-harbor.systems.gov.bt/spms/sprms_core
  tag: "202606291501"
  pullPolicy: Always

imagePullSecrets:
  - name: harbor-secret

containerPort: 8080

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 31975

configMapName: sprms-core-deployment-config
secretName: sprms-core-deployment-secret

pvc:
  enabled: true
  name: sprms-uploads
  mountPath: /data/uploads

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: 500m

readinessProbe:
  enabled: false

livenessProbe:
  enabled: false

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

terminationGracePeriodSeconds: 30
